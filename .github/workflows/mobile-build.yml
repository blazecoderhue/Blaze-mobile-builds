name: Mobile build

# Blaze Android on the temporary public build repo (branch app/mobile).
# Builds the release APK UNSIGNED (R8, not debuggable). Signing happens outside GitHub with the private release key:
# no key, keystore or password is ever in this repo or in Actions.
# Also runs the JVM unit tests and the 360/375 dp screenshot tests (ShotsTest / Shots375Test) on x86.
on:
  push:
    branches: [ "app/mobile" ]
  workflow_dispatch:

permissions:
  contents: write   # only to attach the unsigned APK / shots to a CI pre-release (public download for signing)

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.x", cache: false }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Go libraries (browser VPN, BlazeRouter)
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          (cd wgproxy && CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../app/src/main/jniLibs/arm64-v8a/libwgproxy.so . \
            && CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w" -o ../app/src/main/jniLibs/armeabi-v7a/libwgproxy.so .) || echo "wgproxy build skipped"
          (cd blazerouter && CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o ../app/src/main/jniLibs/arm64-v8a/libblazerouter.so . \
            && CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o ../app/src/main/jniLibs/armeabi-v7a/libblazerouter.so .) || echo "blazerouter build skipped"
      - name: Build unsigned release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace --console=plain 2>&1 | tee build.log
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/*-unsigned.apk "out/Blaze-v${VER}-release-unsigned.apk"
          (cd out && sha256sum *.apk | tee SHA256SUMS)
          echo "${GITHUB_SHA}" > out/COMMIT
      - name: Attach to a CI pre-release (unsigned; signed copies are published elsewhere)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ci-${GITHUB_RUN_ID}"
          gh release create "$TAG" out/*.apk out/SHA256SUMS out/COMMIT --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "CI build ${GITHUB_RUN_ID} (unsigned)" --notes "Unsigned CI build. Not for install."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-unsigned
          retention-days: 14
          path: |
            out/
            build.log

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Unit tests
        run: set -o pipefail; ./gradlew :app:testDebugUnitTest --continue --console=plain 2>&1 | tee test.log
      - name: Summary
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0; bad=[]
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot()
              t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
              for c in r.iter('testcase'):
                  if c.find('failure') is not None or c.find('error') is not None: bad.append(c.get('classname')+'.'+c.get('name'))
          print(f"UNITS tests={t} failures={f} errors={e} skipped={s}")
          for b in bad[:50]: print("FAIL", b)
          PY
      - name: Attach the unit summary to the CI pre-release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ci-${GITHUB_RUN_ID}"
          python3 - > units.txt <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0; bad=[]
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot()
              t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
              for c in r.iter('testcase'):
                  if c.find('failure') is not None or c.find('error') is not None: bad.append(c.get('classname')+'.'+c.get('name'))
          print(f"UNITS tests={t} failures={f} errors={e} skipped={s}")
          for b in bad: print("FAIL", b)
          PY
          for i in $(seq 1 60); do gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break; sleep 30; done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "CI build ${GITHUB_RUN_ID} (unsigned)" --notes "Unsigned CI build. Not for install."
          gh release upload "$TAG" units.txt --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests
          retention-days: 14
          path: |
            test.log
            app/build/test-results/testDebugUnitTest/*.xml

  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Screenshots 360 dp and 375 dp
        env:
          BLAZE_SHOTS: "1"
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --tests 'com.blaze.assistant.ui.ShotsTest' --tests 'com.blaze.assistant.ui.Shots375Test' \
            --continue --console=plain "-Dorg.gradle.jvmargs=-Xmx4g -Xss4m -XX:MaxMetaspaceSize=768m" \
            -Pkotlin.compiler.execution.strategy=in-process 2>&1 | tee shots.log
      - name: Attach shots to the CI pre-release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ci-${GITHUB_RUN_ID}"
          (cd app/build && zip -qr ../../shots.zip shots) || true
          zip -qj shots.zip shots.log || true
          for i in $(seq 1 60); do gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break; sleep 30; done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "CI build ${GITHUB_RUN_ID} (unsigned)" --notes "Unsigned CI build. Not for install."
          gh release upload "$TAG" shots.zip --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          retention-days: 14
          path: |
            shots.log
            app/build/shots/
