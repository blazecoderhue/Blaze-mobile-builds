# Source copy of the workflow used by the public builds repo blazecoderhue/Blaze-mobile-builds (exported there as
# .github/workflows/mobile-build.yml). It never runs from this GitLab repo. Releases: builds repo -> sandbox signing -> Site /dl.
name: Mobile build

# Blaze Android on the temporary public build repo (branch app/mobile).
# Builds the release APK UNSIGNED (R8, not debuggable). Signing happens outside GitHub with the private release key:
# no key, keystore or password is ever in this repo or in Actions.
# Also runs the JVM unit tests and the 360/375 dp screenshot tests (ShotsTest / Shots375Test) on x86.
on:
  push:
    branches: [ "app/mobile" ]
  workflow_dispatch:

permissions:
  contents: read   # artifacts only; no releases

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  # Kotlin JVM backend overflows the default thread stack on the big agent coroutines (StackOverflowError in run 39836794933)

jobs:
  # Blaze Kiln branches (app/engine-*): compile + JVM tests of :kiln, prove :app (debug + release) does not contain Kiln,
  # and build the M1 phone TEST APK (kilnTest build type: applicationId com.blaze.assistant.kilntest, SDK debug key).
  # Never a release: no version bump, no release key, no publishing.
  engine:
    if: ${{ startsWith(github.ref_name, 'app/engine') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Kiln compile + unit tests
        run: set -o pipefail; ./gradlew :kiln:assembleRelease :kiln:testDebugUnitTest --continue --console=plain "-Dorg.gradle.jvmargs=-Xmx4g" 2>&1 | tee engine.log
      - name: App still compiles
        if: always()
        run: set -o pipefail; ./gradlew :app:compileDebugKotlin --console=plain "-Dorg.gradle.jvmargs=-Xmx5g -Xss8m -XX:MaxMetaspaceSize=1g" -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.jvm.target.validation.mode=warning 2>&1 | tee app-compile.log
      - name: Release and debug do not contain Kiln
        if: always()
        run: |
          set -e
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath --console=plain > rel-deps.txt
          ./gradlew -q :app:dependencies --configuration debugRuntimeClasspath --console=plain > dbg-deps.txt
          if grep -E "project :kiln" rel-deps.txt dbg-deps.txt; then echo "::error::Kiln leaked into release/debug"; exit 1; fi
          grep -q "KILN_HARNESS\", \"false\"" app/build.gradle.kts
          echo "release/debug: no :kiln dependency" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Kiln M1 test APK (kilnTest)
        if: always()
        run: set -o pipefail; ./gradlew :app:assembleKilnTest --console=plain "-Dorg.gradle.jvmargs=-Xmx5g -Xss8m -XX:MaxMetaspaceSize=1g" -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.jvm.target.validation.mode=warning 2>&1 | tee kiln-apk.log
      - name: Verify test APK
        if: always()
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/34.0.0"
          A=$(ls app/build/outputs/apk/kilnTest/*.apk | head -1)
          mkdir -p kiln-test && cp "$A" kiln-test/blaze-kiln-m1-test.apk
          cd kiln-test
          "$BT/apksigner" verify --verbose --print-certs blaze-kiln-m1-test.apk | tee verify.txt
          "$BT/aapt2" dump badging blaze-kiln-m1-test.apk > badging.txt
          grep -q "package: name='com.blaze.assistant.kilntest'" badging.txt
          grep -q "versionName='.*-kiln-m1-test'" badging.txt
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml blaze-kiln-m1-test.apk > manifest.txt
          grep -q "com.blaze.assistant.kiln.KilnHarnessActivity" manifest.txt
          grep -q "com.blaze.kiln.slot.A0_0_0" manifest.txt
          grep -q "com.blaze.kiln.slot.P0" manifest.txt
          grep -q '":g0"' manifest.txt
          unzip -l blaze-kiln-m1-test.apk | grep -q "assets/kiln/kiln-testguest.apk"
          sha256sum blaze-kiln-m1-test.apk | tee SHA256SUMS
          grep -E "package:|sdkVersion|targetSdkVersion" badging.txt | tee -a "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: units.txt
        if: always()
        run: |
          python3 - > units.txt <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0; bad=[]
          for p in glob.glob('kiln/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot()
              t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
              for c in r.iter('testcase'):
                  x=c.find('failure') if c.find('failure') is not None else c.find('error')
                  if x is not None: bad.append(c.get('classname')+'.'+c.get('name')+' :: '+(x.get('message') or '')[:300])
          print(f"KILN UNITS tests={t} failures={f} errors={e} skipped={s}")
          for b in bad: print("FAIL", b)
          PY
          cat units.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiln
          retention-days: 3
          path: |
            engine.log
            app-compile.log
            units.txt
            kiln/build/test-results/testDebugUnitTest/*.xml
            kiln/build/outputs/aar/
            kiln-apk.log
            rel-deps.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiln-test-apk
          retention-days: 7
          path: kiln-test/

  apk:
    if: ${{ !startsWith(github.ref_name, 'app/engine') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.x", cache: false }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Go libraries (browser VPN, BlazeRouter)
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          (cd wgproxy && CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../app/src/main/jniLibs/arm64-v8a/libwgproxy.so . \
            && CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w" -o ../app/src/main/jniLibs/armeabi-v7a/libwgproxy.so .) || echo "wgproxy build skipped"
          (cd blazerouter && CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o ../app/src/main/jniLibs/arm64-v8a/libblazerouter.so . \
            && CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o ../app/src/main/jniLibs/armeabi-v7a/libblazerouter.so .) || echo "blazerouter build skipped"
      - name: Build unsigned release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace --console=plain "-Dorg.gradle.jvmargs=-Xmx5g -Xss8m -XX:MaxMetaspaceSize=1g" -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.jvm.target.validation.mode=warning 2>&1 | tee build.log
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/*-unsigned.apk "out/Blaze-v${VER}-release-unsigned.apk"
          (cd out && sha256sum *.apk | tee SHA256SUMS)
          echo "${GITHUB_SHA}" > out/COMMIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-unsigned
          retention-days: 3
          path: |
            out/
            build.log

  unit-tests:
    if: ${{ !startsWith(github.ref_name, 'app/engine') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Unit tests
        run: set -o pipefail; ./gradlew :app:testDebugUnitTest --continue --console=plain "-Dorg.gradle.jvmargs=-Xmx5g -Xss8m -XX:MaxMetaspaceSize=1g" -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.jvm.target.validation.mode=warning 2>&1 | tee test.log
      - name: Summary
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0; bad=[]
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot()
              t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
              for c in r.iter('testcase'):
                  if c.find('failure') is not None or c.find('error') is not None: bad.append(c.get('classname')+'.'+c.get('name'))
          print(f"UNITS tests={t} failures={f} errors={e} skipped={s}")
          for b in bad[:50]: print("FAIL", b)
          PY
      - name: units.txt
        if: always()
        run: |
          python3 - > units.txt <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0; bad=[]
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot()
              t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
              for c in r.iter('testcase'):
                  if c.find('failure') is not None or c.find('error') is not None: bad.append(c.get('classname')+'.'+c.get('name'))
          print(f"UNITS tests={t} failures={f} errors={e} skipped={s}")
          for b in bad: print("FAIL", b)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests
          retention-days: 3
          path: |
            test.log
            units.txt
            app/build/test-results/testDebugUnitTest/*.xml

  shots:
    if: ${{ !startsWith(github.ref_name, 'app/engine') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Screenshots 360 dp and 375 dp
        env:
          BLAZE_SHOTS: "1"
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --tests 'com.blaze.assistant.ui.ShotsTest' --tests 'com.blaze.assistant.ui.Shots375Test' \
            --continue --console=plain "-Dorg.gradle.jvmargs=-Xmx5g -Xss8m -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.jvm.target.validation.mode=warning 2>&1 | tee shots.log
      - name: shots.zip
        if: always()
        run: |
          (cd app/build && zip -qr ../../shots.zip shots) || true
          zip -qj shots.zip shots.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          retention-days: 3
          path: |
            shots.log
            shots.zip
            app/build/shots/
