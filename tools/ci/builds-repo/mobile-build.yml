# Source copy of the workflow used by the public builds repo blazecoderhue/Blaze-mobile-builds (exported there as
# .github/workflows/mobile-build.yml). It never runs from this GitLab repo. Releases: builds repo -> sandbox signing -> Site /dl.
name: Mobile build

# Blaze Android on the temporary public build repo (branch app/mobile).
# Builds the release APK UNSIGNED (R8, not debuggable). Signing happens outside GitHub with the private release key:
# no key, keystore or password is ever in this repo or in Actions.
# Also runs the JVM unit tests and the 360/375 dp screenshot tests (ShotsTest / Shots375Test) on x86.
on:
  push:
    branches: [ "app/mobile" ]
  workflow_dispatch:

permissions:
  contents: read   # artifacts only; no releases

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  # Kotlin JVM backend overflows the default thread stack on the big agent coroutines (StackOverflowError in run 39836794933)

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.x", cache: false }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Go libraries (browser VPN, BlazeRouter)
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          (cd wgproxy && CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../app/src/main/jniLibs/arm64-v8a/libwgproxy.so . \
            && CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w" -o ../app/src/main/jniLibs/armeabi-v7a/libwgproxy.so .) || echo "wgproxy build skipped"
          (cd blazerouter && CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o ../app/src/main/jniLibs/arm64-v8a/libblazerouter.so . \
            && CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o ../app/src/main/jniLibs/armeabi-v7a/libblazerouter.so .) || echo "blazerouter build skipped"
      - name: Build unsigned release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace --console=plain "-Dorg.gradle.jvmargs=-Xmx5g -Xss8m -XX:MaxMetaspaceSize=1g" -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.jvm.target.validation.mode=warning 2>&1 | tee build.log
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/*-unsigned.apk "out/Blaze-v${VER}-release-unsigned.apk"
          (cd out && sha256sum *.apk | tee SHA256SUMS)
          echo "${GITHUB_SHA}" > out/COMMIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-unsigned
          retention-days: 3
          path: |
            out/
            build.log

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Unit tests
        run: set -o pipefail; ./gradlew :app:testDebugUnitTest --continue --console=plain "-Dorg.gradle.jvmargs=-Xmx5g -Xss8m -XX:MaxMetaspaceSize=1g" -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.jvm.target.validation.mode=warning 2>&1 | tee test.log
      - name: Summary
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0; bad=[]
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot()
              t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
              for c in r.iter('testcase'):
                  if c.find('failure') is not None or c.find('error') is not None: bad.append(c.get('classname')+'.'+c.get('name'))
          print(f"UNITS tests={t} failures={f} errors={e} skipped={s}")
          for b in bad[:50]: print("FAIL", b)
          PY
      - name: units.txt
        if: always()
        run: |
          python3 - > units.txt <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0; bad=[]
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot()
              t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
              for c in r.iter('testcase'):
                  if c.find('failure') is not None or c.find('error') is not None: bad.append(c.get('classname')+'.'+c.get('name'))
          print(f"UNITS tests={t} failures={f} errors={e} skipped={s}")
          for b in bad: print("FAIL", b)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests
          retention-days: 3
          path: |
            test.log
            units.txt
            app/build/test-results/testDebugUnitTest/*.xml

  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Screenshots 360 dp and 375 dp
        env:
          BLAZE_SHOTS: "1"
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --tests 'com.blaze.assistant.ui.ShotsTest' --tests 'com.blaze.assistant.ui.Shots375Test' \
            --continue --console=plain "-Dorg.gradle.jvmargs=-Xmx5g -Xss8m -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.jvm.target.validation.mode=warning 2>&1 | tee shots.log
      - name: shots.zip
        if: always()
        run: |
          (cd app/build && zip -qr ../../shots.zip shots) || true
          zip -qj shots.zip shots.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          retention-days: 3
          path: |
            shots.log
            shots.zip
            app/build/shots/

  # 0.45.23 clean-install proof: a debug APK pointed at a local mock gateway (tools/firstrun/mock_gateway.py: fixed replies,
  # no model, no Blaze Cloud) is installed fresh 5 times on an x86_64 emulator (KVM) and driven through the 2-step first run
  # (sign in -> chat with the starter -> restore the account's chats and memory -> first answer) by tools/firstrun/drive.py.
  # Every run is recorded with adb screenrecord; recordings, end screenshots, UI dumps, logcat and the mock's request log
  # are the firstrun-recordings artifact.
  firstrun-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.x", cache: false }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Go libraries (browser VPN, BlazeRouter)
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          (cd wgproxy && CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../app/src/main/jniLibs/arm64-v8a/libwgproxy.so . \
            && CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w" -o ../app/src/main/jniLibs/armeabi-v7a/libwgproxy.so .) || echo "wgproxy build skipped"
          (cd blazerouter && CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o ../app/src/main/jniLibs/arm64-v8a/libblazerouter.so . \
            && CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o ../app/src/main/jniLibs/armeabi-v7a/libblazerouter.so .) || echo "blazerouter build skipped"
      - name: Debug APK for the mock gateway + the account copy to restore
        env:
          BLAZE_SEED_OUT: ${{ github.workspace }}/firstrun/seed.json
        run: |
          set -o pipefail
          mkdir -p firstrun/out
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --tests 'com.blaze.assistant.setup.FirstRunSeedTest' -Pblaze.testBase=http://10.0.2.2:8787 \
            --console=plain "-Dorg.gradle.jvmargs=-Xmx5g -Xss8m -XX:MaxMetaspaceSize=1g" -Pkotlin.compiler.execution.strategy=in-process \
            -Pkotlin.jvm.target.validation.mode=warning 2>&1 | tee firstrun/build.log
          ls -la app/build/outputs/apk/debug/
          test -s firstrun/seed.json
      - name: Mock gateway (fixed replies, no model)
        run: |
          nohup python3 tools/firstrun/mock_gateway.py --port 8787 --seed firstrun/seed.json > firstrun/mock.log 2>&1 &
          sleep 2; curl -sf http://127.0.0.1:8787/health
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 5 clean installs, recorded
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8000M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: python3 tools/firstrun/drive.py --apk app/build/outputs/apk/debug/app-debug.apk --out firstrun/out --runs 5 --seed firstrun/seed.json
      - name: Summary
        if: always()
        run: cat firstrun/out/summary.txt 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || echo "no summary" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firstrun-recordings
          retention-days: 14
          path: |
            firstrun/out/
            firstrun/mock.log
            firstrun/build.log
            firstrun/seed.json
